<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 80 1000 910" role="img" aria-labelledby="title desc">
<title id="title">Adding a system call to xv6: the files and their roles</title>
<desc id="desc">The user interface declaration, assembly stub, trap entry, dispatcher, and kernel implementation. The ps.c command calls the usys.S stub. Supporting build-time files are described in the README.</desc>
